# Decap CMS configuration.
# Backend: GitHub OAuth — Катя логинится своим GitHub-аккаунтом (у которого
# есть доступ к репозиторию), а сохранение формы делает коммит в репозиторий
# сайта напрямую через GitHub API. Cloudflare Worker пересобирает и публикует
# сайт после каждого пуша (как обычно), обычно в течение минуты.
#
# Логин обслуживает сам сайт (см. worker.js в корне репозитория, роуты
# /auth и /callback) — Netlify тут больше не участвует.
backend:
  name: github
  repo: zmhmm-hey/katya-borisova-site
  branch: main
  base_url: https://katyaborisova.art
  auth_endpoint: auth

# После публикации формы в CMS отсюда показывается ссылка на предпросмотр
# (не обязательно, но удобно).
site_url: https://katyaborisova.art
display_url: https://katyaborisova.art

media_folder: "web_images/cms-uploads"
public_folder: "/web_images/cms-uploads"

collections:
  - name: "content"
    label: "Текст и ссылки на сайте"
    files:
      - name: "main"
        label: "Главная страница"
        file: "content.json"
        fields:
          - { label: "Роль (под именем в шапке)", name: "heroRole", widget: "string" }
          - { label: "Подпись под ролью", name: "heroCredential", widget: "string" }
          - label: "Контакты (блок внизу сайта)"
            name: "contacts"
            widget: "object"
            fields:
              - label: "Email"
                name: "email"
                widget: "object"
                fields:
                  - { label: "Ссылка (mailto:...)", name: "url", widget: "string" }
                  - { label: "Текст ссылки", name: "label", widget: "string" }
              - label: "Instagram"
                name: "instagram"
                widget: "object"
                fields:
                  - { label: "Ссылка", name: "url", widget: "string" }
                  - { label: "Текст ссылки", name: "label", widget: "string" }
              - label: "Telegram"
                name: "telegram"
                widget: "object"
                fields:
                  - { label: "Ссылка", name: "url", widget: "string" }
                  - { label: "Текст ссылки", name: "label", widget: "string" }
              - label: "MUBI"
                name: "mubi"
                widget: "object"
                fields:
                  - { label: "Ссылка", name: "url", widget: "string" }
                  - { label: "Текст ссылки", name: "label", widget: "string" }
